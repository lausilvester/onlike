<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 500" width="720" height="500" role="img" aria-labelledby="g4-titulo g4-desc" font-family="Outfit, sans-serif">

  <title id="g4-titulo">Dónde se pierde una reserva antes de existir: las seis etapas de la decisión del viajero</title>
  <desc id="g4-desc">La decisión de un viajero atraviesa seis etapas encadenadas: inspiración, lista corta, comparación, confianza, consulta y reserva. En las tres primeras el viajero ya definió casi todo sin contactar al negocio, que por lo tanto no se entera de que quedó afuera. Recién en la cuarta etapa aparece la consulta. Un negocio que queda fuera de la lista corta no compite por precio ni por reseñas: directamente no compite.</desc>

  <rect x="0" y="0" width="720" height="500" rx="10" fill="#131625"/>

  <text x="48" y="52" font-size="11" font-weight="700" letter-spacing="1.98" fill="#A08AE5">LA DECISIÓN DEL VIAJERO</text>

  <text x="48" y="96" font-size="38" letter-spacing="-1.14" fill="#FFFFFF"><tspan font-weight="200">Dónde se pierde una reserva </tspan><tspan font-weight="700">antes de existir</tspan></text>

  <!-- Conectores -->
  <line x1="136" y1="232" x2="155" y2="232" stroke="#FFFFFF" stroke-opacity="0.3"/>
  <line x1="243" y1="232" x2="262" y2="232" stroke="#FFFFFF" stroke-opacity="0.3"/>
  <line x1="350" y1="232" x2="370" y2="232" stroke="#FFFFFF" stroke-opacity="0.3"/>
  <line x1="458" y1="232" x2="477" y2="232" stroke="#FFFFFF" stroke-opacity="0.3"/>
  <line x1="565" y1="232" x2="584" y2="232" stroke="#FFFFFF" stroke-opacity="0.3"/>

  <!-- Etapas 1 a 3 -->
  <rect x="48" y="210" width="88" height="44" rx="4" fill="#D1FA3E"/>
  <text x="92" y="237" font-size="13" font-weight="700" fill="#131625" text-anchor="middle">Inspiración</text>

  <rect x="155" y="210" width="88" height="44" rx="4" fill="#D1FA3E"/>
  <text x="199" y="237" font-size="13" font-weight="700" fill="#131625" text-anchor="middle">Lista corta</text>

  <rect x="262" y="210" width="88" height="44" rx="4" fill="#D1FA3E"/>
  <text x="306" y="237" font-size="13" font-weight="700" fill="#131625" text-anchor="middle">Comparación</text>

  <!-- Etapas 4 a 6 -->
  <rect x="370" y="210" width="88" height="44" rx="4" fill="#8E51B9"/>
  <text x="414" y="237" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="middle">Confianza</text>

  <rect x="477" y="210" width="88" height="44" rx="4" fill="#8E51B9"/>
  <text x="521" y="237" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="middle">Consulta</text>

  <rect x="584" y="210" width="88" height="44" rx="4" fill="#8E51B9"/>
  <text x="628" y="237" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="middle">Reserva</text>

  <!-- Corchetes rectos -->
  <path d="M48,282 L48,274 L350,274 L350,282" fill="none" stroke="#D1FA3E" stroke-opacity="0.5"/>
  <path d="M370,282 L370,274 L672,274 L672,282" fill="none" stroke="#8E51B9" stroke-opacity="0.7"/>

  <text x="199" y="306" font-size="14" font-weight="400" fill="#FFFFFF" fill-opacity="0.8" text-anchor="middle">Acá ya se decidió casi todo,</text>
  <text x="199" y="326" font-size="14" font-weight="400" fill="#FFFFFF" fill-opacity="0.8" text-anchor="middle">y el negocio no se entera.</text>

  <text x="521" y="306" font-size="14" font-weight="400" fill="#FFFFFF" fill-opacity="0.8" text-anchor="middle">Acá recién aparece</text>
  <text x="521" y="326" font-size="14" font-weight="400" fill="#FFFFFF" fill-opacity="0.8" text-anchor="middle">la consulta.</text>

  <line x1="48" y1="378" x2="672" y2="378" stroke="#FFFFFF" stroke-opacity="0.1"/>

  <text x="360" y="418" font-size="22" letter-spacing="-0.5" text-anchor="middle" fill="#FFFFFF"><tspan font-weight="200">Lo que queda afuera de la lista no compite por precio. </tspan><tspan font-weight="700" fill="#D1FA3E">No compite.</tspan></text>

  <text x="672" y="466" font-size="13" font-weight="700" fill="#D1FA3E" text-anchor="end">onlike.ar</text>

</svg>
